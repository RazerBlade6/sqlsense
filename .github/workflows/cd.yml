name: CD

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - catalog/**
      - corpus/**
      - data/**
      - frontend/**
      - backend/**
      - evals/questions.yaml
      - .github/workflows/cd.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; never cancel one mid-flight.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires approval, and only main may deploy; the deploy role trusts only this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.outputs.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-warehouse
      - uses: ./.github/actions/build-frontend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::825457798946:role/sqlsense-github-deploy
          aws-region: ap-southeast-2
      # SqlSenseFoundation holds the CI/CD roles and is deployed by hand, never by this pipeline.
      - name: cdk deploy
        working-directory: infra
        run: |
          npm ci
          uv sync --locked
          npx cdk deploy SqlSenseData SqlSenseRetrieval SqlSenseApp \
            --require-approval never --outputs-file ../cdk-outputs.json
      - id: outputs
        run: echo "api_url=$(jq -r '.SqlSenseApp.ApiUrl' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-warehouse
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::825457798946:role/sqlsense-github-ci
          aws-region: ap-southeast-2
      - name: Smoke test (Athena serves exactly what was built)
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m evaluation.smoke
      - name: API health
        env:
          API_URL: ${{ needs.deploy.outputs.api_url }}
        run: curl -sf "${API_URL}health"
      # Every question goes through the deployed API (Lambda, pgvector, DynamoDB memory);
      # gold SQL runs on Athena.
      - name: Assistant eval (deployed API)
        working-directory: backend
        env:
          WAREHOUSE: athena
          API_URL: ${{ needs.deploy.outputs.api_url }}
        run: |
          uv run python -m evaluation.runner --api-url "$API_URL" \
            --min-accuracy 0.7 --workers 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results-athena
          path: evals/results/*.json
