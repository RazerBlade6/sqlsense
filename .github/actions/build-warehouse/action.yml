name: Build warehouse
description: Download The Complete Journey (cached) and build the Parquet warehouse in data/warehouse.
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/raw
        key: complete-journey-${{ hashFiles('data/build.py') }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
    - name: Build Parquet warehouse
      shell: bash
      working-directory: data
      run: |
        uv sync --locked --no-dev
        uv run --no-dev python build.py
