name: Build frontend
description: Static export of the Next.js frontend into frontend/out (a CDK asset of SqlSenseApp).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: npm ci and build
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npm run build
