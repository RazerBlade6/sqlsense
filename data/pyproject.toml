[project]
name = "sqlsense-data"
version = "0.2.0"
description = "Download, model and publish the Complete Journey retail dataset"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb>=1.4.0",
  "pyarrow>=21.0.0",
  "pyreadr>=0.5.3",
  "pandas>=2.3.0",
  "pyyaml>=6.0",
  "boto3>=1.43.0",
]

[dependency-groups]
dev = ["ruff>=0.6.0", "botocore[crt]>=1.43.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
