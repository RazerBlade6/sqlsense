[project]
name = "sqlsense-backend"
version = "0.1.0"
description = "Agentic natural-language SQL querying backend for PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.1",
  "sqlglot>=25.20.0",
  "langchain>=0.2.14",
  "langchain-openai>=0.1.22",
  "langgraph>=0.2.14",
  "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
